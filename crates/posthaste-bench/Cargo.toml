[package]
name = "posthaste-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Profiling and benchmarking harness for PostHaste's offline hot paths.
#
# This crate is intentionally kept out of the default workspace build
# (see `default-members` in the root Cargo.toml) because it pulls heavy,
# profiling-only dependencies and a Valgrind-backed bench harness. It is
# exercised by the dedicated `profile.yml` CI workflow, not the main `ci.yml`.

[lib]
name = "posthaste_bench"
path = "src/lib.rs"

[[bin]]
name = "posthaste-profile"
path = "src/main.rs"

[dependencies]
posthaste-domain-model = { path = "../posthaste-domain-model" }
posthaste-domain-service = { path = "../posthaste-domain-service" }
posthaste-query-grammar = { path = "../posthaste-query-grammar" }
posthaste-store = { path = "../posthaste-store" }
# Runtime-tier workload: drive the full mutation -> view-recompute -> frame path
# (not just the store), so the harness can profile the link-bus hot path.
posthaste-authority-server = { path = "../posthaste-authority-server" }
posthaste-client-link = { path = "../posthaste-client-link" }
posthaste-contract-core = { path = "../posthaste-contract-core" }
posthaste-runtime = { path = "../posthaste-runtime" }
posthaste-runtime-api = { path = "../posthaste-runtime-api" }
anyhow = "1"
pprof = { version = "0.15", features = ["flamegraph", "protobuf-codec"] }
dhat = "0.3"
tempfile = "3"
tokio = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
iai-callgrind = "0.16"

[[bench]]
name = "store_criterion"
harness = false

[[bench]]
name = "store_iai"
harness = false

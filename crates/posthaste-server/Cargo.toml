[package]
name = "posthaste-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "posthaste_server"
path = "src/lib.rs"

[[bin]]
name = "posthaste-authority-runtime-server"
path = "src/main.rs"
# The CLI has no unit tests. Library and integration tests cover server
# behavior, so skip the otherwise empty libtest harness for this binary.
test = false

[[bin]]
# The standalone authority server role (L5 §4): serves only the authenticated link.
name = "posthaste-authority-server"
path = "src/bin/authority_server.rs"
test = false

[dependencies]
ammonia = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true }
keyring = { workspace = true }
macaroon = { workspace = true }
oauth2 = { workspace = true }
posthaste-http-api-adapter = { path = "../posthaste-http-api-adapter" }
posthaste-authority-server = { path = "../posthaste-authority-server" }
posthaste-config = { path = "../posthaste-config" }
posthaste-domain-model = { path = "../posthaste-domain-model", features = ["openapi"] }
posthaste-domain-service = { path = "../posthaste-domain-service", features = ["openapi"] }
posthaste-engine = { path = "../posthaste-engine" }
posthaste-imap = { path = "../posthaste-imap" }
posthaste-authority-server-link = { path = "../posthaste-authority-server-link" }
posthaste-contract-core = { path = "../posthaste-contract-core", features = ["openapi"] }
posthaste-observability = { path = "../posthaste-observability" }
posthaste-runtime = { path = "../posthaste-runtime" }
posthaste-runtime-api = { path = "../posthaste-runtime-api", features = ["openapi"] }
posthaste-store = { path = "../posthaste-store" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2.5.8"
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
http-body-util = "0.1"
posthaste-client-link = { path = "../posthaste-client-link" }
posthaste-authority-server-link = { path = "../posthaste-authority-server-link" }
posthaste-replica-core = { path = "../posthaste-replica-core" }
posthaste-testkit = { path = "../posthaste-testkit" }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

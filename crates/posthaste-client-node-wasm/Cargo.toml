[package]
name = "posthaste-client-node-wasm"
version = "0.1.0"
edition = "2021"

# The wasm-bindgen boundary for the client-layer replica (docs/replication/client-link/L2
# §6, docs/replication/client-link/L3): it exposes the portable replica view layer to JS so
# the web `replicaAdapter` can drive it. Values cross the boundary as JSON
# strings (no serde-wasm-bindgen dependency). Built only for wasm32; excluded
# from the native CI workspace build.

[lib]
name = "posthaste_client_node_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
posthaste-contract-core = { path = "../posthaste-contract-core" }
posthaste-replica-core = { path = "../posthaste-replica-core" }
posthaste-replica-projector = { path = "../posthaste-replica-projector" }
serde = { workspace = true }
serde_json = { workspace = true }
# Pinned to exactly match the `wasm-bindgen-cli` nixpkgs provides (the generated
# JS glue is version-locked to the crate). Bump both together.
wasm-bindgen = "=0.2.117"
# uuid is pulled in transitively (posthaste-contract-core -> posthaste-domain-model's
# `generated_id`); for wasm32-unknown-unknown we need its "js" RNG backend. This is
# a transitive override for the browser target.
uuid = { version = "1", features = ["v4", "js"] }

# The near-end engine + its browser IO binding compile only for wasm32 (the
# binding uses wasm-bindgen-futures / js-sys / gloo-timers). Gating them here —
# and the `near_end` module with `cfg(target_arch = "wasm32")` — keeps the native
# `cargo check --workspace` build of this crate (which excludes wasm-only code)
# green while the wasm-frontier check compiles the full boundary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
posthaste-link-near-end = { path = "../posthaste-link-near-end" }
# Pinned to the versions already in Cargo.lock so adding them is churn-free and
# stays compatible with the `wasm-bindgen = 0.2.117` pin above.
wasm-bindgen-futures = "=0.4.67"
js-sys = "=0.3.94"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-channel = "0.3"
futures-util = { workspace = true }

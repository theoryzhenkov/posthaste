[package]
name = "posthaste-link-replica"
version = "0.1.0"
edition = "2021"

# The client-layer replica node's view layer (docs/replication/L2 §4–§6): it
# ingests the served working-set views as its base, folds the outbox over them
# via the shared predictor, and serves optimistic rows to the renderer. Like
# posthaste-link-core it stays portable (serde only, no I/O) so it compiles to
# wasm32-unknown-unknown; the contract<->replica mapping and transport live in
# the host (the web adapter / native node).

[lib]
name = "posthaste_link_replica"
path = "src/lib.rs"

[dependencies]
posthaste-link-core = { path = "../posthaste-link-core" }
serde = { workspace = true }
serde_json = { workspace = true }

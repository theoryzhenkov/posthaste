[package]
name = "posthaste-testkit"
version = "0.1.0"
edition = "2021"
description = "Shared test support: disposable integration harness, a managed real-Stalwart fixture, and a mock Gmail/generic IMAP fixture. Dev-only; consumed via [dev-dependencies]."

[lib]
name = "posthaste_testkit"
path = "src/lib.rs"

[dependencies]
posthaste-config = { path = "../posthaste-config" }
posthaste-domain-model = { path = "../posthaste-domain-model" }
posthaste-domain-service = { path = "../posthaste-domain-service" }
posthaste-imap = { path = "../posthaste-imap" }
posthaste-store = { path = "../posthaste-store" }
imap-codec = "2.0.0-alpha.7"
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

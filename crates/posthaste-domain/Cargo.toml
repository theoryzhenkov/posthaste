[package]
name = "posthaste-domain"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
posthaste-observability = { path = "../posthaste-observability" }
thiserror = { workspace = true }
time = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }

[features]
# Derive `utoipa::ToSchema` on wire-facing domain types so the server can emit
# OpenAPI without coupling the domain crate to the web stack by default.
openapi = ["dep:utoipa"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true

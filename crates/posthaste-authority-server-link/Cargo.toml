[package]
name = "posthaste-authority-server-link"
version = "0.1.0"
edition = "2021"

# The runtime<->authority-server link surface
# (docs/replication/authority-server-link/L1). It is only the two replication
# channels — named mutations up, authoritative base assertions + per-mutation
# confirmation down — not the full RuntimeCore surface, and not the
# client<->runtime link's own surface (posthaste-client-link).
# `AuthorityServerLink` is the Rust abstraction over this link's two channels;
# `AuthorityServerLinkHandle` is the owning wrapper (assertion
# `one-link-transport`).

[lib]
name = "posthaste_authority_server_link"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
posthaste-contract-core = { path = "../posthaste-contract-core" }
posthaste-domain-model = { path = "../posthaste-domain-model" }
# The generic `Sequenced<F>` wire envelope for the down-channel seq (D46) lives
# in the engine crate; this seam types its `DownStream` as `Sequenced<AuthorityServerFrame>`.
posthaste-link-far-end = { path = "../posthaste-link-far-end" }
posthaste-replica-core = { path = "../posthaste-replica-core" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true

[package]
name = "posthaste-authority-server-link"
version = "0.1.0"
edition = "2021"

# The shared coherent-link contract (docs/replication/authority-server-link/L1): the
# transport-neutral replication subset both the client<->runtime and
# runtime<->authority server links speak. It is only the two replication channels —
# named mutations up, authoritative base assertions + per-mutation confirmation
# down — not the full RuntimeCore surface. `LinkTransport` is the Rust
# abstraction over one link's two channels; `AuthorityServerLinkHandle` is the
# runtime<->authority server instantiation. One definition, two consumers, no divergence
# (assertion `one-link-transport`).

[lib]
name = "posthaste_authority_server_link"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
posthaste-contract-core = { path = "../posthaste-contract-core" }
posthaste-domain-model = { path = "../posthaste-domain-model" }
posthaste-link-core = { path = "../posthaste-link-core" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true

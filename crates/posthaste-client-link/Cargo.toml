[package]
name = "posthaste-client-link"
version = "0.1.0"
edition = "2021"

# The client↔runtime link ops extracted from `RuntimeCore`
# (RFC-L2-architecture-cleanup D7/D23): the 10 of 52 `RuntimeCore` methods that
# are the link protocol — session open/close, the three stream families (frames,
# views, events), session-view snapshots, and `forward_mutation` forward — plus the
# subscription/stream types those methods return. ONE trait (`RuntimeLink`):
# its four families are one protocol every consumer drives together, so splitting
# them across traits is ceremony with no subset consumer (XXI).
#
# `replay_events` is dropped (zero production consumers — the runtime builds its
# subscription backlog internally; that stays a private fn in `posthaste-runtime`).
# The sessionless `open_view`/`subscribe_view` pair is kept: `posthaste-http-api-adapter`'s
# `/v1/views` + `/v1/views/{id}/stream` routes are live production consumers.
#
# Depends on `contract-core` (RuntimeCaller + wire view/id types), `domain-model`
# (DomainEvent/EventFilter), and `link-core` (the effect-fold leaf — allowed dep
# per the topology; the link surface sits above it). `futures-util` for BoxStream.

[lib]
name = "posthaste_client_link"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
posthaste-contract-core = { path = "../posthaste-contract-core" }
posthaste-domain-model = { path = "../posthaste-domain-model" }
posthaste-replica-core = { path = "../posthaste-replica-core" }

[lints]
workspace = true

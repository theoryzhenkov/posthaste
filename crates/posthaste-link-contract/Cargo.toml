[package]
name = "posthaste-link-contract"
version = "0.1.0"
edition = "2021"

# The shared coherent-link contract (docs/replication/backend-link/L1): the
# transport-neutral replication subset both the client<->runtime and
# runtime<->backend links speak. It is only the two replication channels —
# named mutations up, authoritative base assertions + per-mutation confirmation
# down — not the full RuntimeCore surface. `LinkTransport` is the Rust
# abstraction over one link's two channels; `BackendLink` is the
# runtime<->backend instantiation. One definition, two consumers, no divergence
# (assertion `one-link-transport`).

[lib]
name = "posthaste_link_contract"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
posthaste-domain = { path = "../posthaste-domain" }
posthaste-link-core = { path = "../posthaste-link-core" }
posthaste-runtime-contract = { path = "../posthaste-runtime-contract" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-stream = { workspace = true }

[lints]
workspace = true

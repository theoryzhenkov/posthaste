[package]
name = "posthaste-authority-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "posthaste_authority_server"
path = "src/lib.rs"

[dependencies]
async-stream = "0.3"
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true }
oauth2 = { workspace = true }
posthaste-config = { path = "../posthaste-config" }
posthaste-contract-core = { path = "../posthaste-contract-core" }
posthaste-domain-model = { path = "../posthaste-domain-model" }
posthaste-domain-service = { path = "../posthaste-domain-service" }
posthaste-engine = { path = "../posthaste-engine" }
posthaste-imap = { path = "../posthaste-imap" }
posthaste-call-policy = { path = "../posthaste-call-policy" }
posthaste-authority-server-link = { path = "../posthaste-authority-server-link" }
posthaste-link-far-end = { path = "../posthaste-link-far-end" }
posthaste-replica-core = { path = "../posthaste-replica-core" }
posthaste-observability = { path = "../posthaste-observability" }
posthaste-runtime = { path = "../posthaste-runtime" }
posthaste-store = { path = "../posthaste-store" }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
# `timeout` for `tower_http::timeout::TimeoutLayer` (RFC-L2-lifecycle-and-errors
# D64, the link-wire's server-side counterpart of the `/v1` request-timeout
# treatment).
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The authority-runtime test harness (tests/authority_runtime_handle.rs) drives
# the near node through the runtime-api + client-link traits + RuntimeCaller,
# so it needs both trait surfaces (the RuntimeCore split, RFC D7/D23).
# Production code is type-only and uses posthaste-contract-core directly (D5).
posthaste-client-link = { path = "../posthaste-client-link" }
posthaste-runtime-api = { path = "../posthaste-runtime-api" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "test-util"] }
# `util` for `ServiceExt::oneshot` in the link-wire timeout tests (D64).
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[package]
name = "posthaste-runtimed"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "posthaste-runtime"
path = "src/main.rs"

# The lean remote runtime daemon: a runtime near node over a remote authority
# server that serves the `/v1` platform to local clients. Depends ONLY on the near crates
# (`posthaste-http-api-adapter` + `posthaste-runtime`) — it never links store/engine/imap.
[dependencies]
posthaste-http-api-adapter = { path = "../posthaste-http-api-adapter" }
posthaste-config = { path = "../posthaste-config" }
posthaste-runtime = { path = "../posthaste-runtime" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tokio-util = { workspace = true }

[lints]
workspace = true

[package]
name = "posthaste-authority-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "posthaste_authority_runtime"
path = "src/lib.rs"

[dependencies]
async-stream = "0.3"
async-trait = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true }
keyring = { workspace = true }
oauth2 = { workspace = true }
posthaste-config = { path = "../posthaste-config" }
posthaste-domain = { path = "../posthaste-domain" }
posthaste-engine = { path = "../posthaste-engine" }
posthaste-imap = { path = "../posthaste-imap" }
posthaste-link-contract = { path = "../posthaste-link-contract" }
posthaste-link-core = { path = "../posthaste-link-core" }
posthaste-link-replica = { path = "../posthaste-link-replica" }
posthaste-observability = { path = "../posthaste-observability" }
posthaste-runtime-contract = { path = "../posthaste-runtime-contract" }
posthaste-store = { path = "../posthaste-store" }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-stream = { workspace = true }

[lints]
workspace = true

[package]
name = "posthaste-call-policy"
version = "0.1.0"
edition = "2021"

# The shared outbound-call **policy core** (RFC-L2-provider-reliability D80/D81/D82):
# the wasm-pure arithmetic + types that decide *how* an outbound provider call
# retries, backs off, deadlines, and classifies — one shared fact for the (M31)
# native provider executor rather than a per-call-site fork (tenet XIV).
#
# Deliberately dependency-thin: pure `std::time::Duration` arithmetic + the shared
# `Terminality` taxonomy (O2: owned by `posthaste-domain-model`, consumed here,
# never re-minted). No tokio, no reqwest, no serde, no ambient clock, no RNG —
# every function takes explicit `now`/`attempt`/`rand_unit` inputs so it is
# deterministic, unit-testable, and compiles to `wasm32-unknown-unknown`.

[lib]
name = "posthaste_call_policy"
path = "src/lib.rs"

[dependencies]
posthaste-domain-model = { path = "../posthaste-domain-model" }

[lints]
workspace = true

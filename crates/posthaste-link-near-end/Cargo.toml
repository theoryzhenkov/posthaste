[package]
name = "posthaste-link-near-end"
version = "0.1.0"
edition = "2021"

# The link near-end engine (RFC-L2-architecture-cleanup D40/D41/D44/D45): the
# consuming half of a link — `forward_mutation` up, frame `subscribe` down — plus
# the resilience policy (request deadlines, jittered capped exponential backoff +
# reconnect, seq-cursor ownership, typed frame parse, permanent-vs-transient
# classification) and the level-triggered reconciler. Wasm-pure: no tokio, no
# reqwest; async is expressed as boxed local futures/streams over an injected
# `Transport` (postJson + openStream) and `Scheduler` (sleep + jitter), so the
# same engine drives the browser (compiled to wasm via `posthaste-link-wasm`) and
# a native in-process client. Timing/IO impls live on the host side of the
# boundary, never here — that keeps the crate on the wasm frontier CI list.

[lib]
name = "posthaste_link_near_end"
path = "src/lib.rs"

[dependencies]
posthaste-contract-core = { path = "../posthaste-contract-core" }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package]
name = "posthaste-store"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = { workspace = true }
posthaste-domain-model = { path = "../posthaste-domain-model" }
posthaste-domain-service = { path = "../posthaste-domain-service" }
posthaste-observability = { path = "../posthaste-observability" }
# Backs the `regexp(pattern, text)` SQLite scalar registered on every connection
# (see `db/connection.rs`) so the smart-mailbox `regex` operator can evaluate
# `text REGEXP ?`.
regex = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Test-only: `#[cfg(test)] mod tests;` (src/lib.rs) parses queries against the
# grammar to exercise `query_message_page_by_rule`; the store itself never
# parses raw query strings — callers hand it an already-parsed rule.
posthaste-query-grammar = { path = "../posthaste-query-grammar" }
# Property-based coverage of the mail-safety prune/floor-guard invariants
# (tests/prune_floor_guard.rs) — randomized across store sizes and prune
# fractions to catch the boundary/absence cases the fixed-example snapshot tests
# don't (the DS1 / DP-C2/C3/C4 mail-loss class).
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

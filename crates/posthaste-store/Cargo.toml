[package]
name = "posthaste-store"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = { workspace = true }
posthaste-domain-model = { path = "../posthaste-domain-model" }
posthaste-domain-service = { path = "../posthaste-domain-service" }
posthaste-observability = { path = "../posthaste-observability" }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Test-only: `#[cfg(test)] mod tests;` (src/lib.rs) parses queries against the
# grammar to exercise `query_message_page_by_rule`; the store itself never
# parses raw query strings — callers hand it an already-parsed rule.
posthaste-query-grammar = { path = "../posthaste-query-grammar" }
tempfile = { workspace = true }

[lints]
workspace = true

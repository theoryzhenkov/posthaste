[package]
name = "posthaste-runtime-contract"
version = "0.1.0"
edition = "2021"

[lib]
name = "posthaste_runtime_contract"
path = "src/lib.rs"

[features]
default = []
openapi = ["dep:utoipa"]

[dependencies]
async-trait = { workspace = true }

[package]
name = "posthaste-runtime-contract"
version = "0.1.0"
edition = "2021"

[lib]
name = "posthaste_runtime_contract"
path = "src/lib.rs"

[features]
default = []
# Forwarded to contract-core so consumers enabling `runtime-contract/openapi`
# (api, server) still get the ToSchema derives that now live there.
openapi = ["posthaste-contract-core/openapi"]

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
posthaste-contract-core = { path = "../posthaste-contract-core" }
posthaste-domain-model = { path = "../posthaste-domain-model" }
serde = { workspace = true }

[lints]
workspace = true

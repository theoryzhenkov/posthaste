[package]
name = "posthaste-contract-core"
version = "0.1.0"
edition = "2021"

# The shared wire vocabulary above domain-model (RFC-L2-architecture-cleanup
# D5/D6): the typed command set, view models, opaque ids, MutationRequest/
# Receipt, MutationSettlementState, and RuntimeAdapterError — everything the
# runtime-contract fuses with the RuntimeCore trait, minus the trait itself. Both
# link surfaces depend on it without dragging RuntimeCore. Wasm-pure: serde only
# (no tokio/reqwest/mail-parser/axum); carries the `openapi` feature that
# consumers forward so ToSchema derives activate.

[lib]
name = "posthaste_contract_core"
path = "src/lib.rs"

[dependencies]
posthaste-domain-model = { path = "../posthaste-domain-model" }
posthaste-link-core = { path = "../posthaste-link-core" }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }

[features]
default = []
# Derive `utoipa::ToSchema` on the wire types so the server can emit OpenAPI.
# Consumers enable this via their own `openapi` feature (runtime-contract and
# the link surface forward it). Forwards to domain-model so the domain types
# the wire types reference (AccountId, AccountOverview, ...) also derive
# ToSchema — mirrors posthaste-domain-service's forwarding.
openapi = ["dep:utoipa", "posthaste-domain-model/openapi"]

[lints]
workspace = true

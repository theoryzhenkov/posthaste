[package]
name = "posthaste-link-wasm"
version = "0.1.0"
edition = "2021"

# The wasm-bindgen boundary for the client-layer replica (docs/replication/client-link/L2
# §6, docs/replication/client-link/L3): it exposes the portable replica view layer to JS so
# the web `replicaAdapter` can drive it. Values cross the boundary as JSON
# strings (no serde-wasm-bindgen dependency). Built only for wasm32; excluded
# from the native CI workspace build.

[lib]
name = "posthaste_link_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
posthaste-link-core = { path = "../posthaste-link-core" }
posthaste-link-replica = { path = "../posthaste-link-replica" }
serde = { workspace = true }
serde_json = { workspace = true }
# Pinned to exactly match the `wasm-bindgen-cli` nixpkgs provides (the generated
# JS glue is version-locked to the crate). Bump both together.
wasm-bindgen = "=0.2.117"

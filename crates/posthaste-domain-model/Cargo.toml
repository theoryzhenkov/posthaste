[package]
name = "posthaste-domain-model"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = { workspace = true }
# Compile-checks a `regex` operator's pattern at the write boundary
# (`validate_condition`) so a malformed pattern is a typed `query_invalid` error,
# never a runtime failure deep in the store. Same engine the store's `regexp`
# SQL function uses, so validation agrees with evaluation.
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# uuid's v4 RNG needs the js backend on wasm32-unknown-unknown (RFC Q4). The
# workspace `uuid` already enables v4; this adds the browser RNG backend for
# the wasm-pure frontier check. Native builds keep the default backend.
uuid = { workspace = true, features = ["js"] }

[features]
# Derive `utoipa::ToSchema` on wire-facing domain types so the server can emit
# OpenAPI without coupling the domain model to the web stack by default.
openapi = ["dep:utoipa"]

[lints]
workspace = true

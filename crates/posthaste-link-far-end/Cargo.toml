[package]
name = "posthaste-link-far-end"
version = "0.1.0"
edition = "2021"

# The link **far-end** engine (RFC D40/D45): the composable native sub-stores a
# fan-in node's serving half assembles — the idempotency-dedup store, the
# settlement-sink store, and the seq-backlog replay store. Neither seam crate
# hosts these; both the runtime's far-end (client↔runtime seam) and the
# authority server's far-end (runtime↔authority-server seam) assemble the same
# sub-stores per D40 (as amended by Q7: sub-stores each far-end assembles, NOT
# one struct-per-subscriber). Native (tokio allowed) — the wasm-pure near-end
# engine lives in `posthaste-link-near-end`.

[lib]
name = "posthaste_link_far_end"
path = "src/lib.rs"

[dependencies]
posthaste-contract-core = { path = "../posthaste-contract-core" }
# `serde` is only for the `Sequenced<F>` wire envelope (the seq that rides
# alongside a seam's frame, D46) — the sub-stores themselves are transport-free.
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

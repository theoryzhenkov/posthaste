[package]
name = "posthaste-replica-core"
version = "0.1.0"
edition = "2021"

# The shared predictor for coherent links (docs/replication/L1 §4.3,
# docs/replication/client-link/L2 §1). It is the single definition of every named mutation's
# local effect, run unchanged by the bundled authority runtime and by the WASM
# client-layer replica. It must stay portable: serde only, no I/O, no native
# time/filesystem/database, so it compiles to wasm32-unknown-unknown.

[lib]
name = "posthaste_replica_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }

[dev-dependencies]
# Test-only: drive the serde wire contract (e.g. the ReplaceMailboxes alias).
# Not part of the portable artifact; serde_json is pure-Rust + wasm-safe anyway.
serde_json = { workspace = true }

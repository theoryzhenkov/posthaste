site_name: PostHaste
site_description: JMAP mail client with MailMate-grade search and conversation-first web UI
docs_dir: docs
site_dir: site
repo_url: https://github.com/theoryzhenkov/posthaste
repo_name: theoryzhenkov/posthaste

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - meta
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - def_list

plugins:
  - search

nav:
  - Home: index.md
  - Architecture:
      - Crate topology (L2): architecture/L2-crate-topology.md
  - State:
      - Mail:
          - Model (L1): state/mail/L1.md
          - Implementation (L2): state/mail/L2.md
          - Implementation patterns (L3): state/mail/L3.md
  - Runtime:
      - Contract (L1): runtime/L1.md
      - Adapter:
          - Surface contract (L1): runtime/adapter/L1.md
          - Sessions and views (L2): runtime/adapter/L2.md
          - Patterns (L3): runtime/adapter/L3.md
      - Mutations:
          - Catalog (L1): runtime/mutations/L1.md
          - Pipeline (L2): runtime/mutations/L2.md
      - Internals:
          - Contract (L1): runtime/internals/L1.md
          - Assembly (L2): runtime/internals/L2.md
          - Patterns (L3): runtime/internals/L3.md
  - Replication:
      - Coherent links (L1): replication/L1.md
      - Client↔runtime link:
          - Seam contract (L1): replication/client-link/L1.md
          - Components (L2): replication/client-link/L2.md
          - Integration (L3): replication/client-link/L3.md
      - Runtime↔authority-server link:
          - Seam contract (L1): replication/authority-server-link/L1.md
          - Components (L2): replication/authority-server-link/L2.md
          - Implementation (L3): replication/authority-server-link/L3.md
  - API:
      - Contracts (L1): api/L1.md
      - Structure and flows (L2): api/L2.md
      - Implementation reference (L3): api/L3.md
      - Endpoint inventory: api/endpoints.md
  - Authority server:
      - Contracts (L1): authority-server/L1.md
      - Structure and flows (L2): authority-server/L2.md
      - Adapter patterns (L3): authority-server/L3.md
  - Client:
      - State contract (L1): client/L1.md
      - Mail runtime (L2): client/L2.md
      - Adapter patterns (L3): client/L3.md
  - UI:
      - Navigation model (L0): ui/L0.md
      - Keyboard contract (L1): ui/L1.md
  - Testing:
      - Domain (L0): testing/L0.md
      - Contracts (L1): testing/L1.md

site_name: PostHaste
site_description: JMAP mail client with MailMate-grade search and conversation-first web UI
docs_dir: docs
site_dir: site
repo_url: https://github.com/theoryzhenkov/posthaste
repo_name: theoryzhenkov/posthaste

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - meta
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - def_list

plugins:
  - search

nav:
  - Home: index.md
  - State:
      - Mail:
          - Model (L1): state/mail/L1.md
          - Implementation (L2): state/mail/L2.md
  - Runtime:
      - Contract (L1): runtime/L1.md
      - Bundled application (L2): runtime/L2.md
  - API:
      - Contracts (L1): api/L1.md
      - Structure and flows (L2): api/L2.md
  - Backend:
      - Contracts (L1): backend/L1.md
      - Structure and flows (L2): backend/L2.md
  - Client:
      - State contract (L1): client/L1.md
      - Mail runtime (L2): client/L2.md
  - Stale specs:
      - L0:
          - Accounts: stale/L0-accounts.md
          - API: stale/L0-api.md
          - Branding: stale/L0-branding.md
          - Compose: stale/L0-compose.md
          - JMAP: stale/L0-jmap.md
          - Lab: stale/L0-lab.md
          - Logging: stale/L0-logging.md
          - Providers: stale/L0-providers.md
          - Search: stale/L0-search.md
          - Sync: stale/L0-sync.md
          - Testing: stale/L0-testing.md
          - UI: stale/L0-ui.md
          - Website: stale/L0-website.md
      - L1:
          - Accounts: stale/L1-accounts.md
          - Compose: stale/L1-compose.md
          - JMAP: stale/L1-jmap.md
          - Lab: stale/L1-lab.md
          - Logging: stale/L1-logging.md
          - Search: stale/L1-search.md
          - Sync: stale/L1-sync.md
          - UI: stale/L1-ui.md
      - L2:
          - Transport: stale/L2-transport.md
          - UI visual reference: stale/L2-ui-visual-reference.md

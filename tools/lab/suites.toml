# PostHaste Lab suite registry.
# Suite IDs use docs-compatible nested TOML tables that flatten to canonical IDs.

[suite.api.health.dev]
level = "integration"
targets = ["daemon"]
profile = "profile.lab.empty.dev"
runners = ["runner.cargo.test.dev"]
tags = ["api", "health", "fast", "lab-smoke"]
paths = [
  "crates/posthaste-server/src/lib.rs",
  "crates/posthaste-server/tests/api_boundary_contracts.rs",
]
command = "cargo test -p posthaste-server health"
timeout_seconds = 300
artifacts = ["log.authority-server.health.dev"]

[suite.api.settings.dev]
level = "integration"
targets = ["daemon"]
profile = "profile.lab.empty.dev"
runners = ["runner.cargo.test.dev"]
tags = ["api", "settings", "fast"]
paths = [
  "crates/posthaste-server/src/lib.rs",
  "crates/posthaste-server/tests/settings_patch.rs",
]
command = "cargo test -p posthaste-server --test settings_patch"
timeout_seconds = 300
artifacts = ["log.authority-server.jsonl.dev"]

[suite.ui.readiness.web.test]
level = "unit"
targets = ["web"]
profile = "profile.lab.empty.test"
runners = ["runner.bun.test"]
tags = ["ui", "readiness", "web", "fast", "lab-smoke"]
paths = [
  "apps/web/src/labReadiness.ts",
  "apps/web/test/labReadiness.test.ts",
]
command = "bun --cwd=apps/web test labReadiness"
timeout_seconds = 60
artifacts = ["artifact.bun.lab-readiness.web.test"]

[suite.ui.surfaces.web.test]
level = "unit"
targets = ["web"]
profile = "profile.lab.empty.test"
runners = ["runner.bun.test"]
tags = ["ui", "surfaces", "web", "fast", "lab-smoke"]
paths = [
  "apps/web/src/App.tsx",
  "apps/web/src/components/InvalidSurface.tsx",
  "apps/web/src/hooks/useSurfaceRouting.ts",
  "apps/web/src/surfaces.ts",
  "apps/web/src/surfaceWindowPolicy.ts",
  "apps/web/test/surfaces.test.ts",
  "apps/web/test/desktop.test.ts",
]
command = "bun --cwd=apps/web test surfaces desktop"
timeout_seconds = 60
artifacts = ["artifact.bun.surfaces.web.test"]

[suite.lab.core.rust.test]
level = "unit"
targets = ["lab"]
runners = ["runner.cargo.test.dev"]
tags = ["lab", "rust", "fast", "lab-smoke"]
paths = [
  "crates/posthaste-lab/Cargo.toml",
  "crates/posthaste-lab/src/lib.rs",
  "crates/posthaste-lab/src/main.rs",
  "tools/lab/justfile",
  "tools/lab/suites.toml",
]
command = "cargo test -p posthaste-lab"
timeout_seconds = 120
artifacts = ["artifact.cargo.posthaste-lab.test"]

[suite.policy.no_telemetry.main]
level = "policy"
targets = ["release"]
runners = ["runner.shell.test"]
tags = ["policy", "release", "fast", "lab-smoke"]
paths = [
  "Cargo.toml",
  "package.json",
  "bun.lock",
  "justfile",
  ".github/workflows/",
  "apps/",
  "crates/",
  "tools/lab/no-telemetry-main.sh",
]
command = "bash tools/lab/no-telemetry-main.sh"
timeout_seconds = 30
artifacts = ["artifact.policy.no-telemetry.main"]

[suite.dev.smoke.local]
level = "smoke"
targets = ["dev"]
profile = "profile.lab.empty.local"
runners = ["runner.just.dev.local"]
tags = ["dev", "smoke", "fast"]
paths = [
  "justfile",
  "tools/dev/justfile",
  "tools/dev/logs/justfile",
  "tools/dev/smoke.sh",
  "tools/lab/justfile",
]
command = "just dev smoke"
timeout_seconds = 300
artifacts = ["artifact.summary.dev.local"]

[suite.desktop.main.linux.test]
level = "smoke"
targets = ["desktop", "linux"]
profile = "profile.lab.empty.test"
runners = ["runner.tauri-playwright.linux.test"]
tags = ["desktop", "tauri", "linux", "smoke"]
paths = [
  "apps/desktop/Cargo.toml",
  "apps/desktop/src/e2e.rs",
  "apps/desktop/src/lib.rs",
  "apps/desktop/tauri.e2e.conf.json",
  "apps/web/src/components/FocusedSurface.tsx",
  "apps/web/src/components/SurfaceHost.tsx",
  "apps/web/src/labReadiness.ts",
  "tools/lab/tauri-playwright/",
]
command = "just lab tauri-smoke"
timeout_seconds = 600
artifacts = ["artifact.playwright.desktop-main.linux.test"]

# --- Profiling (offline store hot paths) -------------------------------------
# Slow + build-heavy; intentionally not tagged `lab-smoke`. Run explicitly with
# `just lab verify --tag profile` or via the `profile.yml` workflow. Artifacts
# are written under the lab run dir and recorded via lab artifact markers.

[suite.profile.store.workloads.local]
level = "profile"
targets = ["store"]
runners = ["runner.cargo.bin.local"]
tags = ["profile", "store", "slow"]
paths = [
  "crates/posthaste-bench/",
  "crates/posthaste-store/src/",
]
command = "cargo run --release -p posthaste-bench --bin posthaste-profile"
timeout_seconds = 900
artifacts = ["artifact.profile.store.flamegraphs"]

[suite.profile.store.criterion.local]
level = "profile"
targets = ["store"]
runners = ["runner.cargo.bench.local"]
tags = ["profile", "store", "bench", "slow"]
paths = [
  "crates/posthaste-bench/",
  "crates/posthaste-store/src/",
]
command = "cargo bench -p posthaste-bench --bench store_criterion"
timeout_seconds = 1200
artifacts = ["artifact.profile.store.criterion"]

[workspace]
members = ["crates/*", "apps/desktop"]
# `posthaste-bench` is a member (shared lockfile/target cache) but kept out of the
# default build: it pulls profiling-only deps and a Valgrind-backed bench harness,
# exercised by `profile.yml` rather than the main `ci.yml`.
default-members = [
  "crates/posthaste-authority-runtime",
  "crates/posthaste-config",
  "crates/posthaste-domain",
  "crates/posthaste-engine",
  "crates/posthaste-imap",
  "crates/posthaste-lab",
  "crates/posthaste-link-core",
  "crates/posthaste-observability",
  "crates/posthaste-runtime-contract",
  "crates/posthaste-server",
  "crates/posthaste-store",
]
exclude = ["crates/target", "vendor/imap-codec", "vendor/imap-types"]
resolver = "2"

[workspace.dependencies]
ammonia = "4"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
dirs = "6"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
imap-client = "0.3"
jmap-client = { git = "https://github.com/theoryzhenkov/jmap-client.git", branch = "feat/ws-correlation" }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "windows-native"] }
macaroon = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring", "pool"] }
mail-parser = "0.11"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
pulldown-cmark = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "=0.3.36", features = ["formatting", "parsing", "serde"] }
toml = "0.8"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["v4"] }

# Clippy policy: base `clippy::all` plus a hand-picked set of pedantic/nursery
# lints that earned their keep in a one-time triage (2026-06). The pedantic and
# nursery *groups* are deliberately left off — enabling them whole produces
# thousands of doc/visibility/style warnings with little signal. Only the lints
# below (real perf wins, footguns, and near-zero-false-positive modernizations)
# are turned on. CI escalates these to `-D warnings`; local builds stay warn.
[workspace.lints.clippy]
# perf
redundant_clone = "warn"
assigning_clones = "warn"
needless_collect = "warn"
or_fun_call = "warn"
implicit_clone = "warn"
# footguns
significant_drop_in_scrutinee = "warn"
used_underscore_binding = "warn"
# modernization (near-zero false positives)
uninlined_format_args = "warn"
manual_string_new = "warn"
needless_raw_string_hashes = "warn"
unused_async = "warn"
needless_continue = "warn"
collapsible_else_if = "warn"
items_after_statements = "warn"
# Deliberately NOT enabled after triage — their only hits are idiomatic here:
#   option_option       — PATCH tristate fields (absent / explicit null / value)
#   unnecessary_wraps   — axum SSE `Result<Event, Infallible>` stream signatures
#   useless_let_if_seq  — noisy; sole hit was a false positive across a loop

[profile.dev]
# Constrained dev VM: /home is under a 50 GB quota, and full DWARF debuginfo
# plus the incremental cache had ballooned target/ to ~38 GB (EDQUOT on build).
# `line-tables-only` keeps panic/backtrace file:line but drops the bulky
# variable/type DWARF, and turning off the incremental cache removes its
# multi-GB on-disk state. Together they keep target/ well under quota. Release
# builds (the dogfood artifacts) use [profile.release] and are unaffected.
debug = "line-tables-only"
incremental = false

[profile.test]
# Inherits the dev profile above (line-tables-only, no incremental); kept
# explicit so the intent survives if the dev profile changes. The full debug
# profile makes parallel `cargo test` links memory-heavy on constrained VMs.
debug = "line-tables-only"

[patch.crates-io]
imap-codec = { path = "vendor/imap-codec" }
imap-types = { path = "vendor/imap-types" }

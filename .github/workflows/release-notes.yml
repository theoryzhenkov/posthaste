name: Sync release notes

# Reconcile the website's release content collection with the live set of
# GitHub releases. On any release event (publish/edit/delete) and on a weekly
# schedule, regenerate every entry from the GitHub API and prune entries whose
# release no longer exists — so the downloads page never links to removed
# (404) builds. Hand-authored Markdown note bodies are preserved per file.
#
# The resulting commit touches apps/site/**, which triggers site-publish.yml to
# rebuild and push the site image, so pruned entries disappear from
# posthaste.theor.net automatically.

on:
  release:
    types: [published, edited, deleted]
  schedule:
    # Monday 04:17 UTC — safety net for releases deleted outside this workflow.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Reconcile release entries with live GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/site/tools/generate-release-notes.mjs --all
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain apps/site/src/content/releases)" ]; then
            git add apps/site/src/content/releases
            git commit -m "chore(site): reconcile release notes with live GitHub releases"
            git push origin HEAD:main
          else
            echo "No release-content changes."
          fi

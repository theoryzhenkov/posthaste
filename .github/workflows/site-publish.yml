name: Publish site image

# Builds the public website (apps/site) into an nginx container and pushes it to
# GHCR. tars' docker-auto-update timer pulls :latest within ~5 min and restarts
# posthaste.theor.net. Release-note commits land on main via release-notes.yml,
# which retriggers this through the content path filter — so new releases roll
# out automatically.

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      # The Starlight docs collection renders the repo-root specs in place, so a
      # spec edit must rebuild the site too (docs/eph + docs/issues are internal
      # and excluded from the published collection, but a change there is cheap
      # to rebuild and harmless).
      - 'docs/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/site-publish.yml'
  workflow_dispatch:

concurrency:
  group: site-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/site/Dockerfile
          push: true
          tags: |
            ghcr.io/theoryzhenkov/posthaste/posthaste-site:latest
            ghcr.io/theoryzhenkov/posthaste/posthaste-site:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Telemetry ingest image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telemetry-image.yml
      - Cargo.lock
      - Cargo.toml
      - crates/posthaste-telemetry-ingest/**
      - deploy/telemetry/**
      - vendor/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: theoryzhenkov/.github/.github/workflows/deploy-docker.yml@main
    with:
      app_name: posthaste-telemetry-ingest
      dockerfile_path: deploy/telemetry/Dockerfile
      build_context: .

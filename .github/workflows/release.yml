name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-serve:
    name: Build serve ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-serve-${{ matrix.platform }}
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux serve dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            mold \
            pkg-config

      - name: Build browser-localhost package
        shell: bash
        run: |
          bun --cwd=apps/web run build
          cargo build --release --bin posthaste
          POSTHASTE_PACKAGE_PLATFORM="${{ matrix.platform }}" bash tools/package/serve.sh

      - name: Print sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - uses: actions/upload-artifact@v4
        with:
          name: posthaste-serve-${{ matrix.platform }}
          if-no-files-found: error
          path: target/distribute/posthaste-serve-*.tar.gz

  build-desktop:
    name: Build desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            bundle_targets: appimage
          - os: macos-latest
            platform: macos
            # Emit the standalone .app alongside the .dmg: the .dmg is the
            # distributed artifact, but the "Verify macOS desktop app signature"
            # step codesign-verifies the .app, which dmg-only bundling does not
            # leave in bundle/macos/.
            bundle_targets: app,dmg
          - os: windows-latest
            platform: windows-x86_64
            bundle_targets: nsis

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-desktop-${{ matrix.platform }}
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mold \
            patchelf \
            wget

      # Reflect the dogfood counter in the installed app version instead of the
      # frozen 0.1.0. `v0.1.0-dogfood.N` -> bundle version `0.1.N` (a valid
      # 3-integer macOS CFBundleShortVersionString); a plain `vX.Y.Z` tag is used
      # as-is. Patches the checked-out config so every build below picks it up.
      - name: Set desktop bundle version from tag
        shell: bash
        run: |
          tag="${RELEASE_TAG#v}"
          if [[ "$tag" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+-dogfood\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            version="$tag"
          fi
          echo "Desktop bundle version: $version"
          node -e "const fs=require('fs');const f='apps/desktop/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$version"

      # Single build (devtools compiled in, gated at runtime); no separate
      # "DevTools" bundle. Build one installer format per OS to keep the release
      # critical path short.
      - name: Build desktop bundles
        if: runner.os != 'macOS'
        shell: bash
        run: |
          bun --cwd=apps/web run build
          bun run tauri build --ci --no-sign --features devtools --bundles "${{ matrix.bundle_targets }}" --config '{"build":{"beforeBuildCommand":null}}'

      - name: Build ad-hoc signed macOS desktop bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bun --cwd=apps/web run build
          bun run tauri build --ci --features devtools --bundles "${{ matrix.bundle_targets }}" --config '{"build":{"beforeBuildCommand":null},"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}'

      - name: Print sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Verify macOS desktop app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          found=0
          while IFS= read -r app; do
            found=1
            codesign --verify --deep --strict --verbose=2 "$app"
          done < <(find target/release/bundle apps/desktop/target/release/bundle -type d -name '*.app' 2>/dev/null)
          test "$found" -eq 1

      - name: Collect desktop bundles
        shell: bash
        run: |
          out="target/distribute/desktop-${{ matrix.platform }}"
          mkdir -p "$out"
          while IFS= read -r file; do
            cp "$file" "$out/"
          done < <(
            find target/release/bundle apps/desktop/target/release/bundle \
              -type f \( \
                -name '*.AppImage' -o \
                -name '*.dmg' -o \
                -name '*.exe' \
              \) 2>/dev/null
          )
          test -n "$(find "$out" -type f -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: posthaste-desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: target/distribute/desktop-${{ matrix.platform }}/*

  publish:
    name: Publish GitHub Release
    needs:
      - build-serve
      - build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install SOPS
        uses: nhedger/setup-sops@v2
        with:
          version: "3.12.1"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Promote nested desktop bundles
        shell: bash
        run: |
          find release-assets -mindepth 2 -type f -print0 \
            | while IFS= read -r -d '' file; do
              base="$(basename "$file")"
              target="release-assets/$base"
              if [ -e "$target" ]; then
                echo "release asset name collision: $target" >&2
                exit 1
              fi
              mv "$file" "$target"
            done
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Add release public key
        shell: bash
        run: cp keys/release-gpg-public.asc release-assets/

      - name: Add macOS launch note
        shell: bash
        run: |
          cat > release-assets/MACOS-INSTALL.txt <<'EOF'
          macOS dogfood builds are ad-hoc signed but not notarized.
          Drag Posthaste.app to Applications. On first launch, Control-click or right-click Posthaste.app, choose Open, then confirm Open. Later launches should work with a normal double-click.
          EOF

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          checksums="$(mktemp)"
          find . -maxdepth 1 -type f -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > "$checksums"
          mv "$checksums" SHA256SUMS

      # Supply-chain steps are best-effort: a Sigstore/Rekor outage (e.g. the
      # "tlog entry 404" failure) must not block publishing dogfood installers.
      # The GPG detached signatures + SHA256SUMS below still provide integrity.
      - name: Attest release artifacts
        uses: actions/attest@v4
        continue-on-error: true
        with:
          subject-path: release-assets/*

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign release artifacts with cosign
        continue-on-error: true
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f \
            ! -name '*.asc' \
            ! -name '*.sigstore.json' \
            -print0 \
            | while IFS= read -r -d '' file; do
              cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
            done

      - name: Sign release artifacts with GPG
        shell: bash
        env:
          RELEASE_SOPS_AGE_KEY: ${{ secrets.RELEASE_SOPS_AGE_KEY }}
        run: |
          if [ -z "$RELEASE_SOPS_AGE_KEY" ]; then
            echo "RELEASE_SOPS_AGE_KEY is not configured; skipping GPG signatures."
            exit 0
          fi

          key_file="$RUNNER_TEMP/release-sops-age-key.txt"
          printf '%s\n' "$RELEASE_SOPS_AGE_KEY" > "$key_file"
          chmod 600 "$key_file"
          cleanup() {
            rm -f "$key_file"
            if [ -n "${GNUPGHOME:-}" ]; then
              rm -rf "$GNUPGHOME"
            fi
          }
          trap cleanup EXIT

          release_gpg_key_id="$(SOPS_AGE_KEY_FILE="$key_file" sops --decrypt --extract '["release_gpg_key_id"]' secrets/release-signing.yaml)"

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"

          SOPS_AGE_KEY_FILE="$key_file" sops --decrypt --extract '["release_gpg_private_key"]' secrets/release-signing.yaml \
            | gpg --batch --import

          gpg_args=(--batch --yes --pinentry-mode loopback --armor --detach-sign --local-user "$release_gpg_key_id")

          find release-assets -maxdepth 1 -type f \
            ! -name '*.asc' \
            ! -name '*.sigstore.json' \
            -print0 \
            | while IFS= read -r -d '' file; do
              gpg "${gpg_args[@]}" "$file"
            done

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release-assets/*

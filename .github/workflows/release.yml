name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      only_desktop_linux:
        description: "Probe: run only the desktop-linux job (no publish)"
        type: boolean
        default: false
      tag:
        description: "Existing tag to publish, for example v0.1.0"
        required: true
      channel:
        description: "Release channel (inferred from the tag if omitted)"
        type: choice
        default: ""
        options:
          - ""
          - nightly
          - stable

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  resolve-channel:
    name: Resolve release channel
    runs-on: ubuntu-latest
    outputs:
      POSTHASTE_RELEASE_CHANNEL: ${{ steps.resolve.outputs.POSTHASTE_RELEASE_CHANNEL }}
      POSTHASTE_BUNDLE_VERSION: ${{ steps.resolve.outputs.POSTHASTE_BUNDLE_VERSION }}
      POSTHASTE_PRERELEASE: ${{ steps.resolve.outputs.POSTHASTE_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve channel from release tag
        id: resolve
        shell: bash
        run: |
          # Tag-push infers the channel from the tag; manual dispatch declares
          # it explicitly so a typoed tag cannot silently flip the channel.
          bash tools/release/resolve-channel.sh "$RELEASE_TAG" "${{ inputs.channel || '' }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"


  build-daemon:
    if: ${{ !inputs.only_desktop_linux }}
    name: Build daemon ${{ matrix.platform }}
    needs: resolve-channel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-daemon-${{ matrix.platform }}
          cache-on-failure: true

      - name: Resolve channel policy
        shell: bash
        env:
          POSTHASTE_RELEASE_CHANNEL: ${{ needs.resolve-channel.outputs.POSTHASTE_RELEASE_CHANNEL }}
        run: bash tools/release/channel-policy.sh "$POSTHASTE_RELEASE_CHANNEL" >> "$GITHUB_ENV"

      - name: Install Linux daemon dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            mold \
            pkg-config

      - name: Build server-side binaries
        shell: bash
        # Build the daemon plus the distributed-topology role binaries and the
        # one-shot install wizard in a single cargo pass: they share the
        # workspace dependency graph, so one build is far cheaper than separate
        # jobs. The wizard's posthaste-config dep is dev-only, so a --bin build
        # never pulls the config graph into the release artifact.
        run: cargo build --release --bin posthaste-authority-runtime-server --bin posthaste-authority-server --bin posthaste-runtime --bin posthaste-wizard

      - name: Package daemon
        shell: bash
        env:
          POSTHASTE_PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: bash tools/package/daemon.sh

      - name: Package authority server node binary
        shell: bash
        env:
          POSTHASTE_PACKAGE_PLATFORM: ${{ matrix.platform }}
          POSTHASTE_BIN: posthaste-authority-server
          POSTHASTE_ARTIFACT_NAME: ${{ env.POSTHASTE_AUTHORITY_SERVER_NAME }}
          POSTHASTE_BIN_LABEL: Posthaste authority server node
        run: bash tools/package/bin.sh

      - name: Package runtime node binary
        shell: bash
        env:
          POSTHASTE_PACKAGE_PLATFORM: ${{ matrix.platform }}
          POSTHASTE_BIN: posthaste-runtime
          POSTHASTE_ARTIFACT_NAME: ${{ env.POSTHASTE_RUNTIME_NAME }}
          POSTHASTE_BIN_LABEL: Posthaste runtime node
        run: bash tools/package/bin.sh

      - name: Package install wizard
        shell: bash
        env:
          POSTHASTE_PACKAGE_PLATFORM: ${{ matrix.platform }}
          POSTHASTE_BIN: posthaste-wizard
          POSTHASTE_ARTIFACT_NAME: ${{ env.POSTHASTE_WIZARD_NAME }}
          POSTHASTE_BIN_LABEL: Posthaste install wizard
        run: bash tools/package/bin.sh

      - name: Print sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - uses: actions/upload-artifact@v4
        with:
          name: posthaste-authority-runtime-server-${{ matrix.platform }}
          if-no-files-found: error
          path: target/distribute/PosthasteAuthorityRuntimeServer*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: posthaste-authority-server-${{ matrix.platform }}
          if-no-files-found: error
          path: target/distribute/PosthasteAuthorityServer*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: posthaste-runtime-${{ matrix.platform }}
          if-no-files-found: error
          path: target/distribute/PosthasteRuntime*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: posthaste-wizard-${{ matrix.platform }}
          if-no-files-found: error
          path: target/distribute/PosthasteWizard*.tar.gz

  build-web:
    if: ${{ !inputs.only_desktop_linux }}
    name: Build web frontend
    needs: resolve-channel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve channel policy
        shell: bash
        env:
          POSTHASTE_RELEASE_CHANNEL: ${{ needs.resolve-channel.outputs.POSTHASTE_RELEASE_CHANNEL }}
        run: bash tools/release/channel-policy.sh "$POSTHASTE_RELEASE_CHANNEL" >> "$GITHUB_ENV"

      - name: Build + package web frontend
        shell: bash
        env:
          # Baked into the web bundle so OAuth account setup can exchange the
          # authorization code (Google rejects the exchange without it).
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
          # Nightly builds exercise the WASM client-layer replica so we can
          # validate it in real web bundles before flipping it on for stable.
          VITE_RUNTIME_REPLICA: ${{ needs.resolve-channel.outputs.POSTHASTE_RELEASE_CHANNEL == 'nightly' && 'true' || 'false' }}
        run: |
          bun --cwd=apps/web run build
          bash tools/package/web.sh

      - uses: actions/upload-artifact@v4
        with:
          name: posthaste-web
          if-no-files-found: error
          path: target/distribute/PosthasteWeb*.tar.gz

  build-cli:
    name: Build posthastectl CLI
    needs: resolve-channel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve channel policy
        shell: bash
        env:
          POSTHASTE_RELEASE_CHANNEL: ${{ needs.resolve-channel.outputs.POSTHASTE_RELEASE_CHANNEL }}
        run: bash tools/release/channel-policy.sh "$POSTHASTE_RELEASE_CHANNEL" >> "$GITHUB_ENV"

      - name: Cross-compile posthastectl per target
        shell: bash
        run: |
          mkdir -p target/distribute
          # Bun target -> release artifact platform suffix.
          targets=(
            "bun-linux-x64:linux-x64"
            "bun-linux-arm64:linux-arm64"
            "bun-darwin-x64:darwin-x64"
            "bun-darwin-arm64:darwin-arm64"
            "bun-windows-x64:windows-x64"
          )
          for entry in "${targets[@]}"; do
            bun_target="${entry%%:*}"
            platform="${entry##*:}"
            # build-cli.ts prints the final artifact path (incl. .exe for
            # windows) as its last stdout line; capture + verify it exists.
            artifact="$(bun run apps/mcp/scripts/build-cli.ts -- "$bun_target" "target/distribute/${POSTHASTE_CLI_NAME}-${platform}" | tail -1)"
            test -n "$artifact" && test -f "$artifact" || { echo "build failed for $bun_target" >&2; exit 1; }
            echo "built $bun_target -> $artifact"
          done

      - uses: actions/upload-artifact@v4
        with:
          # Intermediate: bare, unsigned cross-compiled binaries (build-cli
          # runs on ubuntu-latest, cross-compiling all five targets — no
          # macOS runner here, so codesign/notarization cannot happen in this
          # job). The package-cli job below codesigns + notarizes the darwin
          # binaries and repackages every platform as a .tar.gz; publish
          # consumes its `posthaste-cli` artifact, not this one.
          name: posthaste-cli-raw
          if-no-files-found: error
          path: target/distribute/PosthasteCTL*

  package-cli:
    if: ${{ !inputs.only_desktop_linux }}
    name: Sign + notarize + package posthastectl CLI
    needs: [resolve-channel, build-cli]
    # macOS Gatekeeper hard-rejects an unsigned CLI binary as "damaged" on
    # Apple Silicon (arm64 requires *some* valid signature to execute at
    # all). codesign/notarytool are Darwin-only, so this needs a real macOS
    # runner even though build-cli itself cross-compiles from Linux. See
    # docs/eph/RFC-L2-scripting.md §7.10(a).
    runs-on: macos-latest
    env:
      POSTHASTE_RELEASE_CHANNEL: ${{ needs.resolve-channel.outputs.POSTHASTE_RELEASE_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve channel policy
        shell: bash
        run: |
          bash tools/release/channel-policy.sh "$POSTHASTE_RELEASE_CHANNEL" >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: posthaste-cli-raw
          path: target/distribute/cli-raw

      # Same identity resolution as the build-desktop job: Developer ID
      # Application when the release signing secrets are configured, ad-hoc
      # fallback otherwise. Applied on BOTH channels — enforce_macos_signing
      # only controls whether ad-hoc is an acceptable fallback (see next
      # step), not which identity a configured cert resolves to.
      - name: Import Apple Developer certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: tools/release/import-macos-certificate.sh

      - name: Require Apple Developer ID for stable CLI signing
        shell: bash
        run: |
          if [ "${POSTHASTE_ENFORCE_MACOS_SIGNING:-}" = "true" ] && [ "${POSTHASTE_MACOS_SIGNING:-}" != "developer-id" ]; then
            echo "Stable macOS CLI binaries must use Apple Developer ID signing." >&2
            echo "Configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and KEYCHAIN_PASSWORD repository secrets." >&2
            exit 1
          fi

      - name: Configure App Store Connect API key
        shell: bash
        env:
          POSTHASTE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          POSTHASTE_APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          if [ -z "${POSTHASTE_APPLE_API_KEY:-}" ] || [ -z "${POSTHASTE_APPLE_API_KEY_PRIVATE_KEY:-}" ]; then
            echo "App Store Connect API key is not configured; notarization can still use APPLE_ID credentials if present."
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_${POSTHASTE_APPLE_API_KEY}.p8"
          printf '%s\n' "$POSTHASTE_APPLE_API_KEY_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "POSTHASTE_APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Codesign, notarize, and package the CLI binaries
        shell: bash
        env:
          POSTHASTE_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          POSTHASTE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          POSTHASTE_APPLE_ID: ${{ secrets.APPLE_ID }}
          POSTHASTE_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          POSTHASTE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash tools/release/sign-and-package-cli.sh target/distribute/cli-raw target/distribute

      - uses: actions/upload-artifact@v4
        with:
          name: posthaste-cli
          if-no-files-found: error
          path: target/distribute/PosthasteCTL*.tar.gz

  build-desktop:
    name: Build desktop ${{ matrix.platform }}
    # Also needs build-cli: the posthastectl sidecar (RFC-L2-scripting §7 rider
    # 9/14) is bundled into the app from build-cli's raw cross-compiled binaries,
    # so this job downloads that artifact and stages it before `tauri build`.
    needs: [resolve-channel, build-cli]
    runs-on: ${{ matrix.os }}
    env:
      # Resolved by apps/desktop/build.rs into a compile-time constant the binary
      # self-reports via --print-release-channel (checked by the smoke step), and
      # passed to the web bundle so the two cannot disagree.
      POSTHASTE_RELEASE_CHANNEL: ${{ needs.resolve-channel.outputs.POSTHASTE_RELEASE_CHANNEL }}
      POSTHASTE_BUNDLE_VERSION: ${{ needs.resolve-channel.outputs.POSTHASTE_BUNDLE_VERSION }}
      VITE_RELEASE_CHANNEL: ${{ needs.resolve-channel.outputs.POSTHASTE_RELEASE_CHANNEL }}
      # Nightly desktop builds exercise the WASM client-layer replica so we can
      # validate WebView WASM loading before enabling it on stable.
      VITE_RUNTIME_REPLICA: ${{ needs.resolve-channel.outputs.POSTHASTE_RELEASE_CHANNEL == 'nightly' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # cli_platform / target_triple: the posthastectl sidecar is staged as
          # apps/desktop/binaries/posthastectl-<target_triple>[.exe] before the
          # tauri build. cli_platform selects build-cli's raw artifact
          # (PosthasteCTL[Nightly]-<cli_platform>); target_triple is the Rust
          # host triple of this runner, which is the exact suffix Tauri's
          # externalBin resolver expects for this platform.
          - os: ubuntu-latest
            platform: linux-x86_64
            bundle_targets: appimage
            cli_platform: linux-x64
            target_triple: x86_64-unknown-linux-gnu
          # Pinned to macos-14 (arm64): the DMG step (bundle_dmg.sh) hits the
          # hdiutil "Resource busy" flake far less on macos-14 than on newer
          # runner images. Same architecture as macos-latest, so the artifact
          # stays aarch64 and binaries remain forward-compatible. Bump when
          # GitHub retires macos-14, and keep in sync with warm-release-cache.yml.
          - os: macos-14
            platform: macos
            # Emit the standalone .app alongside the .dmg: the .dmg is the
            # distributed artifact, but the "Verify macOS desktop app signature"
            # step codesign-verifies the .app, which dmg-only bundling does not
            # leave in bundle/macos/.
            bundle_targets: app,dmg
            # macos-14 is Apple Silicon, so the desktop app builds aarch64 and
            # the matching sidecar is the darwin-arm64 CLI.
            cli_platform: darwin-arm64
            target_triple: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            bundle_targets: nsis
            cli_platform: windows-x64
            target_triple: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve channel policy
        shell: bash
        run: |
          # Materialize the per-channel policy (identity, manifest, devtools,
          # signing, updater endpoint) into GITHUB_ENV from one source of truth.
          bash tools/release/channel-policy.sh "$POSTHASTE_RELEASE_CHANNEL" >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-desktop-${{ matrix.platform }}
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # -- posthastectl sidecar (RFC-L2-scripting §7 rider 9/14) ---------------
      # Bundle posthastectl INTO the desktop app so the app's Tauri updater
      # carries app + embedded server + CLI as one unit. Tauri's
      # `bundle.externalBin` (tauri.conf.json: "binaries/posthastectl") requires
      # the resolved binary to exist at
      #   apps/desktop/binaries/posthastectl-<target_triple>[.exe]
      # BEFORE `tauri build` runs (externalBin is validated at bundle time). We
      # reuse build-cli's cross-compiled raw binaries instead of rebuilding.
      # Tauri strips the -<triple> suffix when it copies the binary into the
      # bundle, so the INSTALLED name is `posthastectl` (posthastectl.exe on
      # Windows) — exactly what posthaste-wizard's sidecar_candidates() expects
      # (crates/posthaste-wizard/src/ctl.rs, ctl_binary_name()).
      - name: Download posthastectl raw binaries
        uses: actions/download-artifact@v4
        with:
          name: posthaste-cli-raw
          path: cli-raw

      - name: Stage posthastectl as the Tauri sidecar
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          src="cli-raw/${POSTHASTE_CLI_NAME}-${{ matrix.cli_platform }}${ext}"
          dest="apps/desktop/binaries/posthastectl-${{ matrix.target_triple }}${ext}"
          mkdir -p apps/desktop/binaries
          if [ ! -f "$src" ]; then
            echo "sidecar source binary not found: $src" >&2
            ls -la cli-raw >&2 || true
            exit 1
          fi
          cp "$src" "$dest"
          chmod +x "$dest"
          echo "staged Tauri sidecar: $dest"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Linux ships the CLI as a bundle RESOURCE (usr/lib/<Product>/binaries/),
            # not externalBin: linuxdeploy's patchelf/ldd pass corrupts a Bun
            # --compile binary's appended payload if it sits in usr/bin (NO_STRIP
            # only disables strip, not patchelf — verified root cause, see the
            # linuxdeploy research in RFC-L2-scripting distribution notes).
            # Resources keep their name verbatim: stage triple-less.
            cp "$src" "apps/desktop/binaries/posthastectl"
            chmod +x "apps/desktop/binaries/posthastectl"
          fi

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mold \
            patchelf \
            wget

      # Reflect the release tag in the installed app version. Nightly/rc
      # tags are rewritten to a valid 3-integer macOS CFBundleShortVersionString;
      # plain stable tags pass through unchanged. The helper is shared with the
      # updater manifest generator so the two never diverge.
      - name: Set desktop bundle version from tag
        shell: bash
        run: |
          echo "Desktop bundle version: $POSTHASTE_BUNDLE_VERSION"
          node -e "const fs=require('fs');const f='apps/desktop/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\\n')" "$POSTHASTE_BUNDLE_VERSION"

      - name: Import Apple Developer certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: tools/release/import-macos-certificate.sh

      - name: Require Apple developer signing for macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "${POSTHASTE_ENFORCE_MACOS_SIGNING:-}" = "true" ]; then
            if [ "${POSTHASTE_MACOS_SIGNING:-}" != "developer-id" ]; then
              echo "Stable macOS release builds must use Apple Developer ID signing." >&2
              exit 1
            fi
          elif [ "${POSTHASTE_MACOS_SIGNING:-}" != "developer-id" ] && [ "${POSTHASTE_MACOS_SIGNING:-}" != "adhoc" ]; then
            echo "macOS release builds must be signed with an Apple Developer ID." >&2
            echo "Configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and KEYCHAIN_PASSWORD repository secrets, or set POSTHASTE_MACOS_SIGNING=adhoc explicitly for an unsigned internal build." >&2
            exit 1
          fi

      - name: Configure App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          POSTHASTE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          POSTHASTE_APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          if [ -z "${POSTHASTE_APPLE_API_KEY:-}" ] || [ -z "${POSTHASTE_APPLE_API_KEY_PRIVATE_KEY:-}" ]; then
            echo "App Store Connect API key is not configured; notarization can still use APPLE_ID credentials if present."
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_${POSTHASTE_APPLE_API_KEY}.p8"
          printf '%s\n' "$POSTHASTE_APPLE_API_KEY_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "POSTHASTE_APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # channel-aware updater endpoint so a built artifact can only ever follow
      # one channel. The default checked-in tauri.conf.json is left on the old
      # dogfood URL for unsupervised local builds.
      - name: Build desktop bundles
        if: runner.os != 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          bun --cwd=apps/web run build
          devtools_flag=""
          if [ "${POSTHASTE_INCLUDE_DEVTOOLS:-false}" = "true" ]; then
            devtools_flag="--features devtools"
          fi
          # Channel identity + updater endpoint are baked in at build time via
          # --config so an artifact cannot switch channels.
          # externalBin is injected HERE (not committed in tauri.conf.json): the
          # Tauri context validates externalBin at compile time, so a committed
          # entry would make every plain `cargo check` of the desktop crate
          # demand the staged binary (breaking CI/dev). The release build stages
          # it (step above) and merges it in via --config.
          # Sidecar DESCOPED on Linux for now: linuxdeploy fails on the Bun
          # --compile binary even with NO_STRIP (root cause needs a local
          # x86_64 repro; the AppImage sidecar also lacks POSTHASTE_APP_DIR
          # wiring to be discoverable). Linux users get the CLI via the wizard
          # tarball path. Windows injects below; macOS injects in its own step.
          sidecar_config=""
          verbose_flag=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            sidecar_config="\"externalBin\":[\"binaries/posthastectl\"],"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # See the staging step: resource, not externalBin, on Linux.
            # --verbose so a linuxdeploy failure surfaces its REAL stderr
            # (tauri-bundler swallows it at the default log level).
            sidecar_config="\"resources\":[\"binaries/posthastectl\"],"
            verbose_flag="--verbose"
          fi
          config="{\"build\":{\"beforeBuildCommand\":null},\"bundle\":{${sidecar_config}"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            config="${config}\"createUpdaterArtifacts\":true}"
          else
            config="${config%,}}"
            echo "TAURI_SIGNING_PRIVATE_KEY not set; building without updater artifacts." >&2
          fi
          config="${config},\"identifier\":\"$POSTHASTE_IDENTIFIER\",\"productName\":\"$POSTHASTE_PRODUCT_NAME\",\"plugins\":{\"updater\":{\"endpoints\":[\"$POSTHASTE_UPDATER_ENDPOINT\"]}}}"
          # Per-channel app icon: merged via a second --config (deep-merge;
          # arrays replace) so the channel's committed icon set wins without
          # editing the identity config above. Stable uses the default set.
          icon_config=()
          if [ -n "${POSTHASTE_ICON_DIR:-}" ] && [ "$POSTHASTE_ICON_DIR" != "icons" ]; then
            d="$POSTHASTE_ICON_DIR"
            icon_config=(--config "{\"bundle\":{\"icon\":[\"$d/32x32.png\",\"$d/128x128.png\",\"$d/128x128@2x.png\",\"$d/icon.icns\",\"$d/icon.ico\"]}}")
          fi
          # No `--no-sign`: it would also skip *updater* signing. Linux/Windows
          # have no code-signing certs configured, so code signing is a no-op
          # here regardless, while updater signatures (.sig) are now produced.
          bun run tauri build --ci $devtools_flag $verbose_flag --bundles "${{ matrix.bundle_targets }}" --config "$config" "${icon_config[@]}"

      - name: Build macOS desktop bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          POSTHASTE_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          POSTHASTE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          POSTHASTE_APPLE_ID: ${{ secrets.APPLE_ID }}
          POSTHASTE_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          POSTHASTE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          configure_notarization() {
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            notarization_enabled=false

            if [ -n "${POSTHASTE_APPLE_API_KEY:-}" ] || [ -n "${POSTHASTE_APPLE_API_ISSUER:-}" ] || [ -n "${POSTHASTE_APPLE_API_KEY_PATH:-}" ]; then
              if [ -n "${POSTHASTE_APPLE_API_KEY:-}" ] && [ -n "${POSTHASTE_APPLE_API_ISSUER:-}" ] && [ -n "${POSTHASTE_APPLE_API_KEY_PATH:-}" ]; then
                export APPLE_API_KEY="$POSTHASTE_APPLE_API_KEY"
                export APPLE_API_ISSUER="$POSTHASTE_APPLE_API_ISSUER"
                export APPLE_API_KEY_PATH="$POSTHASTE_APPLE_API_KEY_PATH"
                notarization_enabled=true
                echo "macOS notarization enabled with App Store Connect API key."
              else
                echo "Incomplete App Store Connect API key secrets; building signed but not notarized."
              fi
              return
            fi

            team_id="${POSTHASTE_APPLE_TEAM_ID:-}"
            if [ -z "$team_id" ] && [[ "${APPLE_SIGNING_IDENTITY:-}" =~ \(([A-Z0-9]{3,})\)$ ]]; then
              team_id="${BASH_REMATCH[1]}"
            fi

            if [ -n "${POSTHASTE_APPLE_ID:-}" ] || [ -n "${POSTHASTE_APPLE_PASSWORD:-}" ] || [ -n "$team_id" ]; then
              if [ -n "${POSTHASTE_APPLE_ID:-}" ] && [ -n "${POSTHASTE_APPLE_PASSWORD:-}" ] && [ -n "$team_id" ]; then
                export APPLE_ID="$POSTHASTE_APPLE_ID"
                export APPLE_PASSWORD="$POSTHASTE_APPLE_PASSWORD"
                export APPLE_TEAM_ID="$team_id"
                notarization_enabled=true
                echo "macOS notarization enabled with Apple ID credentials."
              else
                echo "Incomplete Apple ID notarization secrets; building signed but not notarized."
              fi
            else
              echo "No macOS notarization credentials configured; building signed but not notarized."
            fi
          }

          bun --cwd=apps/web run build
          configure_notarization
          if [ "${POSTHASTE_ENFORCE_MACOS_SIGNING:-}" = "true" ] && [ "$notarization_enabled" != "true" ]; then
            echo "Stable macOS release builds require notarization credentials." >&2
            exit 1
          fi
          devtools_flag=""
          if [ "${POSTHASTE_INCLUDE_DEVTOOLS:-false}" = "true" ]; then
            devtools_flag="--features devtools"
          fi
          # Emit signed updater artifacts only when the updater signing key is
          # configured, so releases still build without it.
          updater=""
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            updater='"createUpdaterArtifacts":true,'
          else
            echo "TAURI_SIGNING_PRIVATE_KEY not set; building without updater artifacts." >&2
          fi
          identity_config="\"identifier\":\"$POSTHASTE_IDENTIFIER\",\"productName\":\"$POSTHASTE_PRODUCT_NAME\","
          updater_config="\"plugins\":{\"updater\":{\"endpoints\":[\"$POSTHASTE_UPDATER_ENDPOINT\"]}}}"
          # !!! HIGHEST-RISK SIGNING DETAIL — do not remove without understanding !!!
          # The posthastectl sidecar (RFC-L2-scripting §7 rider 9) is a Bun
          # `--compile` binary that JIT-compiles at runtime. Under the hardened
          # runtime (developer-id path below) the JIT is BLOCKED unless the
          # signature carries the allow-jit / allow-unsigned-executable-memory /
          # disable-library-validation entitlements — the SAME plist the
          # standalone CLI is signed with in tools/release/sign-and-package-cli.sh.
          #
          # Ordering is already correct and DOES NOT need a manual pre-sign:
          # tauri-bundler copies externalBin into Contents/MacOS, then codesigns
          # INSIDE-OUT (nested sidecars/frameworks first, app bundle last) using
          # ONE global entitlements path for every SignTarget — so setting
          # bundle.macOS.entitlements makes Tauri sign the nested posthastectl
          # WITH these entitlements during its own pass, before notarization runs
          # over the whole .app. Without this key Tauri would re-sign the sidecar
          # with hardened runtime and NO entitlements, stripping the JIT
          # capability and crashing the CLI on first launch. Path is relative to
          # tauri.conf.json (apps/desktop), same resolution as the icon config.
          # Applied on both signing branches (harmless under ad-hoc / hardened
          # runtime off). VERIFY on the next release run: `codesign -d
          # --entitlements - <app>/Contents/MacOS/posthastectl` must list allow-jit.
          sidecar_entitlements="../../tools/release/posthastectl-entitlements.plist"
          if [ "${POSTHASTE_MACOS_SIGNING:-adhoc}" = "developer-id" ]; then
            echo "Building macOS bundle with Apple signing identity: ${APPLE_SIGNING_IDENTITY}"
            macos_bundle_config="{\"build\":{\"beforeBuildCommand\":null},\"bundle\":{\"externalBin\":[\"binaries/posthastectl\"],${updater}\"macOS\":{\"entitlements\":\"${sidecar_entitlements}\",\"hardenedRuntime\":true}},${identity_config}${updater_config}"
          else
            echo "Building macOS bundle with ad-hoc signing. Configure APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and KEYCHAIN_PASSWORD repository secrets to use Apple Developer signing."
            macos_bundle_config="{\"build\":{\"beforeBuildCommand\":null},\"bundle\":{\"externalBin\":[\"binaries/posthastectl\"],${updater}\"macOS\":{\"entitlements\":\"${sidecar_entitlements}\",\"signingIdentity\":\"-\",\"hardenedRuntime\":false}},${identity_config}${updater_config}"
          fi

          # Per-channel app icon: merged via a second --config (deep-merge;
          # arrays replace) so the channel's committed icon set wins. Stable
          # uses the default set.
          icon_config=()
          if [ -n "${POSTHASTE_ICON_DIR:-}" ] && [ "$POSTHASTE_ICON_DIR" != "icons" ]; then
            d="$POSTHASTE_ICON_DIR"
            icon_config=(--config "{\"bundle\":{\"icon\":[\"$d/32x32.png\",\"$d/128x128.png\",\"$d/128x128@2x.png\",\"$d/icon.icns\",\"$d/icon.ico\"]}}")
          fi

          # Tauri's generated bundle_dmg.sh intermittently fails on GitHub macOS
          # runners with hdiutil "Resource busy" while detaching the staging
          # image (tauri-apps/tauri#14686). The app is signed, notarized, and
          # stapled before the DMG step, and the DMG carries no separate
          # notarization (Tauri only codesigns it), so retrying the whole build
          # clears the flake; re-notarization only happens on an actual retry.
          detach_stale_dmg_mounts() {
            # A failed bundle_dmg.sh can leave the staging volume mounted, which
            # is what makes the next hdiutil detach report "Resource busy".
            local vol="/Volumes/${POSTHASTE_PRODUCT_NAME}"
            if [ -d "$vol" ]; then
              echo "Detaching stale DMG volume: $vol" >&2
              hdiutil detach "$vol" -force 2>/dev/null || true
            fi
          }

          attempts="${POSTHASTE_MACOS_BUILD_ATTEMPTS:-3}"
          attempt=1
          while true; do
            if bun run tauri build --ci $devtools_flag \
                --bundles "${{ matrix.bundle_targets }}" \
                --config "$macos_bundle_config" "${icon_config[@]}"; then
              break
            fi
            if [ "$attempt" -ge "$attempts" ]; then
              echo "macOS bundle failed after $attempt attempt(s)." >&2
              exit 1
            fi
            echo "macOS bundle attempt $attempt/$attempts failed (known bundle_dmg.sh/hdiutil flake); cleaning up and retrying..." >&2
            detach_stale_dmg_mounts
            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Print sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Verify macOS desktop app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          found=0
          while IFS= read -r app; do
            found=1
            codesign --verify --deep --strict --verbose=2 "$app"
          done < <(find target/release/bundle apps/desktop/target/release/bundle -type d -name '*.app' 2>/dev/null)
          test "$found" -eq 1

      - name: Collect desktop bundles
        shell: bash
        run: |
          out="target/distribute/desktop-${{ matrix.platform }}"
          mkdir -p "$out"
          while IFS= read -r file; do
            cp "$file" "$out/"
          done < <(
            find target/release/bundle apps/desktop/target/release/bundle \
              -type f \( \
                -name '*.AppImage' -o \
                -name '*.dmg' -o \
                -name '*.exe' -o \
                -name '*.app.tar.gz' -o \
                -name '*.sig' \
              \) 2>/dev/null
          )
          test -n "$(find "$out" -type f -print -quit)"

      - name: Smoke desktop bundle
        if: env.POSTHASTE_RUN_ARTIFACT_SMOKE == 'true'
        shell: bash
        run: |
          bash tools/release/smoke-desktop-bundle.sh \
            "${POSTHASTE_RELEASE_CHANNEL}" \
            "${{ matrix.platform }}" \
            "target/distribute/desktop-${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: posthaste-desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: target/distribute/desktop-${{ matrix.platform }}/*
  publish:
    if: ${{ !inputs.only_desktop_linux }}
    name: Publish GitHub Release
    needs:
      - build-daemon
      - build-web
      - package-cli
      - build-desktop
      - resolve-channel
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      POSTHASTE_RELEASE_CHANNEL: ${{ needs.resolve-channel.outputs.POSTHASTE_RELEASE_CHANNEL }}
      POSTHASTE_PRERELEASE: ${{ needs.resolve-channel.outputs.POSTHASTE_PRERELEASE }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve channel policy
        shell: bash
        run: |
          bash tools/release/channel-policy.sh "$POSTHASTE_RELEASE_CHANNEL" >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      - name: Install SOPS
        uses: nhedger/setup-sops@v2
        with:
          version: "3.12.1"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Drop raw unsigned CLI intermediates
        shell: bash
        run: |
          # merge-multiple flattens the posthaste-cli-raw intermediate next to
          # package-cli's signed tarballs; publishing the bare unsigned
          # binaries would re-create the Gatekeeper trap. Only *.tar.gz CLI
          # assets ship.
          find release-assets -maxdepth 1 -type f -name 'PosthasteCTL*' \
            ! -name '*.tar.gz' -print -delete

      - name: Promote nested desktop bundles
        shell: bash
        run: |
          find release-assets -mindepth 2 -type f -print0 \
            | while IFS= read -r -d '' file; do
              base="$(basename "$file")"
              target="release-assets/$base"
              if [ -e "$target" ]; then
                echo "release asset name collision: $target" >&2
                exit 1
              fi
              mv "$file" "$target"
            done
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Add release public key
        shell: bash
        run: cp keys/release-gpg-public.asc release-assets/

      - name: Add wizard bootstrap script
        shell: bash
        # Ship install.sh as a release asset so it is checksummed + signed
        # alongside the binaries. It is also published to the rolling channel
        # release below for a stable `curl | sh` URL.
        run: cp tools/install/install.sh release-assets/

      - name: Add macOS launch note
        shell: bash
        run: |
          cat > release-assets/MACOS-INSTALL.txt <<'RELEASE_EOF'
          macOS nightly builds are Apple Developer signed when the release signing secrets are configured. If notarization credentials are not configured, macOS may still require the first launch to be approved manually.
          Drag Posthaste.app to Applications. If macOS blocks the first launch, Control-click or right-click Posthaste.app, choose Open, then confirm Open. Later launches should work with a normal double-click.

          CLI (posthastectl): download PosthasteCTL[Nightly]-darwin-<arch>.tar.gz and extract it from Terminal with `tar -xzf` (not Finder/Archive Utility, which can re-apply the quarantine flag to the extracted binary). The binary is Apple Developer ID signed and notarized when the release signing secrets are configured (ad-hoc signed otherwise), so Apple Silicon Macs will run it without the "is damaged and can't be opened" error. A notarized command-line tool cannot carry a stapled ticket, so the very first run needs network access for Gatekeeper to check it online. If Gatekeeper still blocks the first run, either Control-click the binary and choose Open, or run:
              xattr -d com.apple.quarantine ./PosthasteCTL*-darwin-*
          RELEASE_EOF

      - name: Generate updater manifest
        id: generate_manifest
        shell: bash
        run: |
          if find release-assets -maxdepth 1 -name '*.sig' -print -quit | grep -q .; then
            bash tools/release/generate-updater-manifest.sh release-assets "$RELEASE_TAG" "$POSTHASTE_UPDATER_MANIFEST"
            echo "manifest_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No updater signatures present; skipping $POSTHASTE_UPDATER_MANIFEST (updater signing key not configured)."
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          checksums="$(mktemp)"
          find . -maxdepth 1 -type f -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > "$checksums"
          mv "$checksums" SHA256SUMS

      # Supply-chain steps are best-effort: a Sigstore/Rekor outage (e.g. the
      # "tlog entry 404" failure) must not block publishing nightly installers.
      # The GPG detached signatures + SHA256SUMS below still provide integrity.
      - name: Attest release artifacts
        uses: actions/attest@v4
        continue-on-error: true
        with:
          subject-path: release-assets/*

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign release artifacts with cosign
        continue-on-error: true
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f \
            ! -name '*.asc' \
            ! -name '*.sigstore.json' \
            -print0 \
            | while IFS= read -r -d '' file; do
              cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
            done

      - name: Sign release artifacts with GPG
        shell: bash
        env:
          RELEASE_SOPS_AGE_KEY: ${{ secrets.RELEASE_SOPS_AGE_KEY }}
        run: |
          if [ -z "$RELEASE_SOPS_AGE_KEY" ]; then
            echo "RELEASE_SOPS_AGE_KEY is not configured; skipping GPG signatures."
            exit 0
          fi

          key_file="$RUNNER_TEMP/release-sops-age-key.txt"
          printf '%s\n' "$RELEASE_SOPS_AGE_KEY" > "$key_file"
          chmod 600 "$key_file"
          cleanup() {
            rm -f "$key_file"
            if [ -n "${GNUPGHOME:-}" ]; then
              rm -rf "$GNUPGHOME"
            fi
          }
          trap cleanup EXIT

          release_gpg_key_id="$(SOPS_AGE_KEY_FILE="$key_file" sops --decrypt --extract '["release_gpg_key_id"]' secrets/release-signing.yaml)"

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"

          SOPS_AGE_KEY_FILE="$key_file" sops --decrypt --extract '["release_gpg_private_key"]' secrets/release-signing.yaml \
            | gpg --batch --import

          gpg_args=(--batch --yes --pinentry-mode loopback --armor --detach-sign --local-user "$release_gpg_key_id")

          find release-assets -maxdepth 1 -type f \
            ! -name '*.asc' \
            ! -name '*.sigstore.json' \
            -print0 \
            | while IFS= read -r -d '' file; do
              gpg "${gpg_args[@]}" "$file"
            done

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: ${{ env.POSTHASTE_IS_STABLE == 'true' && env.POSTHASTE_PRERELEASE == 'false' }}
          prerelease: ${{ env.POSTHASTE_PRERELEASE == 'true' }}
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Update channel rolling tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/release/update-rolling-tag.sh "$POSTHASTE_RELEASE_CHANNEL" "$RELEASE_TAG"

      # The Tauri updater endpoint is baked to a channel-scoped URL
      # (`releases/download/<channel>/<manifest>`). That URL only resolves if a
      # GitHub *release* exists for the rolling tag and carries the manifest as
      # an asset — moving the tag alone does not attach assets. So publish the
      # manifest to the rolling channel release (creating it if absent) so the
      # stable URL always serves the latest manifest. Only the manifest lives
      # here; versioned bundles stay on the versioned release and are referenced
      # by URL from the manifest.
      - name: Publish updater manifest to rolling channel release
        if: steps.generate_manifest.outputs.manifest_exists == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.POSTHASTE_RELEASE_CHANNEL }}
          name: ${{ env.POSTHASTE_PRODUCT_NAME }}
          body: |
            Rolling release for the `${{ env.POSTHASTE_RELEASE_CHANNEL }}` channel.

            This release holds only the Tauri updater manifest (`${{ env.POSTHASTE_UPDATER_MANIFEST }}`), which points at the latest versioned bundles. It is overwritten on every release; do not download installers from here — use the versioned release tags.
          prerelease: ${{ env.POSTHASTE_PRERELEASE == 'true' }}
          # Never let a channel rolling release become the global "latest"
          # pointer; that belongs to the versioned stable release.
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/${{ env.POSTHASTE_UPDATER_MANIFEST }}

      # Publish the wizard bootstrap to the rolling channel release so
      # `releases/download/<channel>/install.sh` is a stable `curl | sh` URL
      # that always resolves the latest build. Runs unconditionally (unlike the
      # manifest step, which needs updater signing), creating the rolling
      # release if it does not yet exist. Listed after the manifest step so its
      # release name/body wins; existing assets (the manifest) are preserved.
      - name: Publish wizard bootstrap to rolling channel release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.POSTHASTE_RELEASE_CHANNEL }}
          name: ${{ env.POSTHASTE_PRODUCT_NAME }}
          body: |
            Rolling release for the `${{ env.POSTHASTE_RELEASE_CHANNEL }}` channel.

            Holds the wizard bootstrap (`install.sh`) and, when updater signing
            is configured, the Tauri updater manifest. Both point at the latest
            versioned build; download installers from the versioned release tags,
            not from here.

            Bootstrap the install wizard:

                curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ env.POSTHASTE_RELEASE_CHANNEL }}/install.sh | sh
          prerelease: ${{ env.POSTHASTE_PRERELEASE == 'true' }}
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/install.sh
name: CI

on:
  pull_request:
  push:
    branches: [main, integrated-model]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          cache-on-failure: true
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold \
            patchelf
      - run: cargo fmt --all -- --check
      # posthaste-bench (profiling harness) is built/run by profile.yml, not here.
      - run: cargo clippy --workspace --all-targets --exclude posthaste-bench -- -D warnings
      - run: cargo test --workspace --exclude posthaste-bench

  # HARD send-path gate (RFC send-path-gate): a live-Stalwart end-to-end proof
  # that a send FILES INTO SENT and NOT DRAFTS — the beta-blocking regression
  # class (onSuccessUpdateEmail mis-keyed → every send stuck in Drafts,
  # self-sends undelivered) that previously shipped because the only assertion
  # was `sent || inbox` (masks exactly this bug) AND its CI job was soft-failed.
  # This job is REQUIRED — no continue-on-error. It runs the dedicated
  # regression test plus the parity test whose send assertions are the exact
  # filing invariants (in Sent, not in Drafts, inbox delivery asserted for the
  # self-send), both living in apps/client/backend (posthaste-client-backend)
  # and mirrored locally by `just backend send-gate`. Stalwart is provisioned
  # DETERMINISTICALLY (pinned version + SHA-256, no `latest`, no private nix
  # flake) by the same script the dev stack documents; it fetches BOTH the
  # server and stalwart-cli (seed.sh needs the CLI to import the fixture
  # maildir). The StalwartFixture spawns the server on dynamic loopback ports
  # (no service container), and delivery is local Stalwart→Stalwart, so no
  # network is touched after provisioning.
  send-path-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse the `rust` job's build cache to keep this gate fast.
          shared-key: ci-rust
          cache-on-failure: true
      - name: Provision pinned Stalwart (server + CLI)
        run: bash tools/dev/stalwart/provision-ci.sh
      - name: Send-path gate (regression + parity send assertions)
        env:
          POSTHASTE_STALWART_INTEGRATION: "1"
        run: |
          cargo test -p posthaste-client-backend \
            --test stalwart_send_regression \
            --test stalwart_provider_parity

  # The integrated app's frontend (apps/client/frontend): typecheck + tests +
  # production build. Its backend/model crates are covered by the `rust` job
  # (workspace tests include the generated-TS freshness test); the live
  # end-to-end proof is `integrated-live-gate`.
  integrated-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun --cwd=apps/client/frontend run check
      # Charter ratchet (docs/client/L2-charter.md §The ratchet): fails on
      # NEW violations only; committed baselines carry the slice 3-5 debt.
      - run: bun --cwd=apps/client/frontend run check:charter
      - run: bun --cwd=apps/client/frontend test
      - run: bun --cwd=apps/client/frontend run build

  # The tools package (apps/tools): posthastectl + the MCP server over the
  # shared operation registry — typecheck, tests, and a compile smoke of the
  # standalone binary.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun --cwd=apps/tools run typecheck
      - run: bun --cwd=apps/tools test
      - run: bun --cwd=apps/tools run build:cli

  # The shipped desktop PACKAGING path — the one release step nothing else
  # exercises. Compilation is already covered: apps/client/desktop is a
  # workspace member, so the `rust` job's `clippy/test --workspace` builds it.
  # What was never covered is what actually breaks — staging the posthastectl
  # sidecar where `bundle.externalBin` resolves it, and bundling. Both of this
  # class's tag-time failures were in those steps, which ran nowhere until a
  # tag was cut.
  #
  # Mirrors the Linux leg of release.yml's build-desktop, including the empty
  # externalBin override (rationale in that job's sidecar note). The sidecar is
  # still staged here even though the AppImage does not carry it, so the
  # staging script stays under test on the cheapest runner — it is shared with
  # the release build, so a break here is a break there.
  desktop-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own key: this is a release-profile bundle, not the `rust` job's
          # dev-profile workspace build.
          shared-key: ci-desktop-package
          cache-on-failure: true
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            mold \
            patchelf \
            wget
      - run: bun install --frozen-lockfile
      - name: Stage posthastectl sidecar
        run: bash tools/release/stage-sidecar.sh
      - name: Assert the sidecar landed where externalBin resolves it
        run: |
          # The staging script is the contract `bundle.externalBin` depends on;
          # assert its output rather than trusting a zero exit.
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          dest="apps/client/desktop/binaries/posthastectl-${triple}"
          test -x "$dest" || {
            echo "sidecar missing or not executable: $dest" >&2
            ls -la apps/client/desktop/binaries || true
            exit 1
          }
      # tauri.conf.json's beforeBuildCommand builds the frontend, so this also
      # covers the frontend -> bundle wiring. externalBin is cleared to match
      # the Linux release build.
      - name: Bundle the desktop app (AppImage)
        working-directory: apps/client/desktop
        run: bun x tauri build --ci --bundles appimage --config '{"bundle":{"externalBin":[]}}'

  # HARD live gate for the integrated backend: the full loop (account -> sync
  # -> inject -> converge -> command -> counts) plus the new-surfaces scenario
  # against a real pinned Stalwart — same deterministic provisioning as
  # send-path-gate. Required, no continue-on-error.
  integrated-live-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          cache-on-failure: true
      - name: Provision pinned Stalwart (server + CLI)
        run: bash tools/dev/stalwart/provision-ci.sh
      - name: Integrated-app live gate
        env:
          POSTHASTE_STALWART_INTEGRATION: "1"
        run: cargo test -p posthaste-client-backend --test live_stalwart

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun --cwd=apps/site run check
      - run: bun --cwd=apps/site run test
      - run: bun --cwd=apps/site run build

  # Lab control plane (posthaste-lab): registry loading + the lab-smoke suites
  # (posthaste-lab's own tests and the no-telemetry policy check).
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v3
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-lab-rust
          cache-on-failure: true
      - name: Install Linux linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Lab smoke
        id: lab_smoke
        run: just lab smoke
      - name: Upload lab smoke artifacts
        if: ${{ failure() && steps.lab_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: lab-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/lab/smoke/*/manifest.json
            target/lab/smoke/*/summary.json
            target/lab/smoke/*/artifacts/**
          if-no-files-found: warn
          retention-days: 14


# The integrated desktop shell: a Tauri v2 app that embeds
# posthaste-client-backend in-process. The shell assembles the backend over
# the default AppPaths, serves the loopback API on an ephemeral port with a
# per-launch session token, and injects {port, token} into every webview.
#
# DEPENDENCY ALLOWLIST: posthaste-client-backend, posthaste-config,
# posthaste-observability, and the tauri crates. The split-model machinery
# (posthaste-server, runtime/link crates, contract-core, the authority
# server, the http-api adapter) must never be declared here.

[package]
name = "posthaste-client-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "posthaste_client_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
# The desktop app binary keeps the legacy name so in-place updates land on
# the same executable. Mirrored by `mainBinaryName` in tauri.conf.json.
name = "posthaste-client"
path = "src/main.rs"

[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-utils = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2.5.8"

posthaste-client-backend = { path = "../backend" }
posthaste-observability = { path = "../../../crates/posthaste-observability" }

axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package]
name = "posthaste-client-models"
version = "0.1.0"
edition = "2021"

# The client protocol's single source of truth: the state document, surfaces,
# patches, and commands, exported to TypeScript via ts-rs into
# `../frontend/src/gen/`.
#
# DEPENDENCY ALLOWLIST: serde + ts-rs + the domain model, nothing else. In
# particular nothing from posthaste-contract-core's frame vocabulary or the
# link crates may enter this crate.

[dependencies]
posthaste-domain-model = { path = "../../../crates/posthaste-domain-model" }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }

[lints]
workspace = true

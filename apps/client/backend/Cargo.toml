[package]
name = "posthaste-client-backend"
version = "0.1.0"
edition = "2021"

# The client's backend: the one evaluator. Owns sessions, the surface
# materializer (reading the store's `_effective` views), the
# dirty→coalesce→diff recomputer, the SSE state-document stream, and the
# command endpoint feeding the outbox with typed mail intents.
#
# DEPENDENCY ALLOWLIST: the domain core + `models` + the HTTP stack. The
# runtime/link/replica crates (posthaste-runtime, the link crates,
# contract-core, replica-*) must never appear below — that machinery is what
# this backend replaces.

[dependencies]
posthaste-client-models = { path = "../models" }
posthaste-config = { path = "../../../crates/posthaste-config" }
posthaste-domain-model = { path = "../../../crates/posthaste-domain-model" }
posthaste-domain-service = { path = "../../../crates/posthaste-domain-service" }
posthaste-engine = { path = "../../../crates/posthaste-engine" }
posthaste-imap = { path = "../../../crates/posthaste-imap" }
posthaste-observability = { path = "../../../crates/posthaste-observability" }
posthaste-store = { path = "../../../crates/posthaste-store" }

axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

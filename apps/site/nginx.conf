server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Pretty bootstrap URL so `curl -fsSL
  # https://posthaste.theor.net/install_wizard.sh | sh` works — redirect (curl
  # -L follows) to the rolling install.sh asset on the GitHub release, keeping
  # the canonical script in one place (no drift).
  location = /install_wizard.sh {
    return 302 https://github.com/theoryzhenkov/posthaste/releases/download/nightly/install.sh;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}

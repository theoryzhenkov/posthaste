server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The wizard installer is retired; fail the old `curl -fsSL
  # .../install_wizard.sh | sh` bootstrap loudly instead of redirecting to a
  # stale release asset.
  location = /install_wizard.sh {
    return 410;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}

[package]
name = "posthaste-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "posthaste_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = ["embedded-server"]
# Embed the Posthaste server in-process (bundled `.dmg`). When OFF, the desktop
# shell builds without an embedded backend (client-only deployment seam); the
# connection-profile runtime that replaces it lands in Phase B.
embedded-server = []
devtools = ["tauri/devtools"]
e2e-testing = ["dep:tauri-plugin-playwright"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-utils = "2"
tauri-plugin-opener = "2"
tauri-plugin-playwright = { version = "0.2.2", optional = true }
url = "2.5.8"
posthaste-observability = { path = "../../crates/posthaste-observability" }
posthaste-server = { path = "../../crates/posthaste-server" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
keyring = { workspace = true }
dirs = { workspace = true }
